<!DOCTYPE html>

<html lang="pt-BR">

    <head>

        <meta charset="UTF-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>Meu Perfil • Padaroca</title>

        <link rel="stylesheet" href="css/profile.css">

    </head>

    <body>

        <main class="profile-page">

            <!-- =====================
                 CABEÇALHO
            ===================== -->

            <header class="profile-header">

                <button
                    class="back-profile-button"
                    type="button">

                    ← Voltar

                </button>

                <h1>Meu Perfil</h1>

                <div class="profile-header-spacer"></div>

            </header>

            <!-- =====================
                 CARD DO PERFIL
            ===================== -->

            <section class="profile-card">

                <!-- IDENTIDADE -->

                <div class="profile-identity">

                    <div class="profile-avatar">
                        A
                    </div>

                    <div class="profile-identity-info">

                        <h2 class="profile-name">
                            Administrador
                        </h2>

                        <p class="profile-username">
                            @admin
                        </p>

                        <span class="profile-role">
                            Administrador
                        </span>

                    </div>

                </div>

                <div class="profile-divider"></div>

                <!-- =====================
                     DADOS PESSOAIS
                ===================== -->

                <section class="profile-section">

                    <h3>Dados pessoais</h3>

                    <div class="profile-form-grid">

                        <div class="profile-field profile-field-full">

                            <label for="profile-name-input">
                                Nome completo
                            </label>

                            <input
                                type="text"
                                id="profile-name-input"
                                class="profile-name-input"
                                autocomplete="name"
                                placeholder="Digite seu nome completo">

                        </div>

                        <div class="profile-field">

                            <label for="profile-email-input">
                                E-mail
                            </label>

                            <input
                                type="email"
                                id="profile-email-input"
                                class="profile-email-input"
                                autocomplete="email"
                                placeholder="seu@email.com">

                        </div>

                        <div class="profile-field">

                            <label for="profile-phone-input">
                                Telefone
                            </label>

                            <input
                                type="tel"
                                id="profile-phone-input"
                                class="profile-phone-input"
                                autocomplete="tel"
                                placeholder="(00) 00000-0000">

                        </div>

                    </div>

                </section>

                <div class="profile-divider"></div>

                <!-- =====================
                     ENDEREÇO
                ===================== -->

                <section class="profile-section">

                    <h3>Endereço</h3>

                    <div class="profile-form-grid">

                        <div class="profile-field profile-field-full">

                            <label for="profile-address-input">
                                Rua
                            </label>

                            <input
                                type="text"
                                id="profile-address-input"
                                class="profile-address-input"
                                autocomplete="street-address"
                                placeholder="Digite sua rua">

                        </div>

                        <div class="profile-field">

                            <label for="profile-number-input">
                                Número
                            </label>

                            <input
                                type="text"
                                id="profile-number-input"
                                class="profile-number-input"
                                placeholder="Número">

                        </div>

                        <div class="profile-field">

                            <label for="profile-zip-input">
                                CEP
                            </label>

                            <input
                                type="text"
                                id="profile-zip-input"
                                class="profile-zip-input"
                                autocomplete="postal-code"
                                placeholder="00000-000">

                        </div>

                        <div class="profile-field">

                            <label for="profile-neighborhood-input">
                                Bairro
                            </label>

                            <input
                                type="text"
                                id="profile-neighborhood-input"
                                class="profile-neighborhood-input"
                                autocomplete="address-level3"
                                placeholder="Digite seu bairro">

                        </div>

                        <div class="profile-field">

                            <label for="profile-city-input">
                                Cidade
                            </label>

                            <input
                                type="text"
                                id="profile-city-input"
                                class="profile-city-input"
                                autocomplete="address-level2"
                                placeholder="Digite sua cidade">

                        </div>

                    </div>

                </section>

                <div class="profile-divider"></div>

                <!-- =====================
                     DADOS DA CONTA
                ===================== -->

                <section class="profile-section">

                    <h3>Dados da conta</h3>

                    <div class="profile-account-data">

                        <div class="profile-account-item">

                            <span class="profile-data-label">
                                Login
                            </span>

                            <strong class="profile-data-username">
                                admin
                            </strong>

                        </div>

                        <div class="profile-account-item">

                            <span class="profile-data-label">
                                Cargo
                            </span>

                            <strong class="profile-data-role">
                                Administrador
                            </strong>

                        </div>

                    </div>

                </section>

                <p class="profile-error"></p>

                <p class="profile-success"></p>

                <!-- =====================
                     AÇÕES
                ===================== -->

                <div class="profile-actions">

                    <button
                        type="button"
                        class="cancel-profile-button">

                        Cancelar

                    </button>

                    <button
                        type="button"
                        class="save-profile-button">

                        Salvar alterações

                    </button>

                </div>

            </section>

        </main>

        <script
            type="module"
            src="js/profile.js"></script>

    </body>

</html>
