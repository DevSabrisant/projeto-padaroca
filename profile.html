<!DOCTYPE html>

<html lang="pt-BR">

    <head>

        <meta charset="UTF-8">

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>Meu Perfil • Padaroca</title>

        <link rel="stylesheet" href="css/profile.css">

    </head>

    <body>

        <main class="profile-page">

            <!-- =====================
                 CABEÇALHO
            ===================== -->

            <header class="profile-header">

                <button class="back-profile-button">
                    ← Voltar
                </button>

                <h1>Meu Perfil</h1>

                <div></div>

            </header>

            <!-- =====================
                 PERFIL
            ===================== -->

            <section class="profile-card">

                <div class="profile-identity">

                    <div class="profile-avatar">
                        A
                    </div>

                    <div class="profile-identity-info">

                        <h2 class="profile-name">
                            Administrador
                        </h2>

                        <p class="profile-username">
                            @administrador
                        </p>

                        <span class="profile-role">
                            Administrador
                        </span>

                    </div>

                </div>

                <div class="profile-divider"></div>

                <!-- =====================
                     DADOS DO USUÁRIO
                ===================== -->

                <section class="profile-section">

                    <h3>Dados do usuário</h3>

                    <div class="profile-data">

                        <div class="profile-data-item">

                            <span class="profile-data-label">
                                Nome
                            </span>

                            <strong class="profile-data-name">
                                Administrador
                            </strong>

                        </div>

                        <div class="profile-data-item">

                            <span class="profile-data-label">
                                Login
                            </span>

                            <strong class="profile-data-username">
                                administrador
                            </strong>

                        </div>

                        <div class="profile-data-item">

                            <span class="profile-data-label">
                                Cargo
                            </span>

                            <strong class="profile-data-role">
                                Administrador
                            </strong>

                        </div>

                        <div class="profile-data-item">

                            <span class="profile-data-label">
                                E-mail
                            </span>

                            <strong class="profile-data-email">
                                Não cadastrado
                            </strong>

                        </div>

                    </div>

                </section>

                <div class="profile-divider"></div>

                <!-- =====================
                     DESEMPENHO
                ===================== -->

                <section class="profile-section">

                    <div class="profile-section-header">

                        <h3>Desempenho</h3>

                        <span class="profile-section-badge">
                            Em breve
                        </span>

                    </div>

                    <div class="profile-stats">

                        <div class="profile-stat-card">

                            <span class="profile-stat-label">
                                Vendas hoje
                            </span>

                            <strong class="profile-stat-value">
                                R$ 0,00
                            </strong>

                        </div>

                        <div class="profile-stat-card">

                            <span class="profile-stat-label">
                                Pedidos
                            </span>

                            <strong class="profile-stat-value">
                                0
                            </strong>

                        </div>

                        <div class="profile-stat-card">

                            <span class="profile-stat-label">
                                Total vendido
                            </span>

                            <strong class="profile-stat-value">
                                R$ 0,00
                            </strong>

                        </div>

                    </div>

                </section>

            </section>

        </main>

        <script type="module" src="js/profile.js"></script>

    </body>

</html>
